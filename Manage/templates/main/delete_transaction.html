{% extends 'main/base.html' %}
{% block title %}Delete Transaction{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
    <h3>Are you sure you want to delete this transaction?</h3>
    <p><strong>{{ transaction.description }}</strong> — ₹{{ transaction.amount }}</p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'transaction' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
